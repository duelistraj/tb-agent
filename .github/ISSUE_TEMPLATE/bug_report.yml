name: Bug report
description: Report a reproducible tb-agent problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include PATs, OAuth tokens, installation credentials, setup-session handles, or absolute local paths.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tb-agent --version`.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows foreground mode
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps with credentials and private paths removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
